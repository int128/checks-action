name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run test
      - run: pnpm run build

      - name: Run int128/checks-action (create-check-run)
        uses: ./
        with:
          operation: create-check-run
          check-run-name: e2e-test / create-check-run
          title: E2E Test (create-check-run)
          summary: |
            This check runs end-to-end tests for the "create-check-run" operation.
            It should create a check run successfully.
          text: |
            {"value": 123}

      - id: e2e-get-check-run
        name: Run int128/checks-action (get-check-run)
        uses: ./
        with:
          operation: get-check-run
          check-run-name: e2e-test / create-check-run
      - run: echo "$CHECK_RUN_TEXT" | jq .
        env:
          CHECK_RUN_TEXT: ${{ steps.e2e-get-check-run.outputs.check-run-text }}

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run check
      - uses: int128/update-generated-files-action@cf464119e796f83eac0a9e85021c568269aa9e1a # v2.103.0
