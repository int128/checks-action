name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run test
      - run: pnpm run build

      - name: Run int128/checks-action (create-check-run)
        uses: ./
        with:
          operation: create-check-run
          check-run-name: e2e-test / create-check-run
          title: E2E Test (create-check-run)
          summary: |
            This check runs end-to-end tests for the "create-check-run" operation.
            It should create a check run successfully.
          text: |
            {"value": 123}

      - id: e2e-get-check-run
        name: Run int128/checks-action (get-check-run)
        uses: ./
        with:
          operation: get-check-run
          check-run-name: e2e-test / create-check-run
      - run: echo "$CHECK_RUN_TEXT" | jq .
        env:
          CHECK_RUN_TEXT: ${{ steps.e2e-get-check-run.outputs.check-run-text }}

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run check
      - uses: int128/update-generated-files-action@9a687cd12f9425997aba80e89b623e089a62b9d8 # v2.90.0
