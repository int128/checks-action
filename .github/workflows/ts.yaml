name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run test
      - run: pnpm run build

      - name: Run int128/checks-action (create-check-run)
        uses: ./
        with:
          operation: create-check-run
          check-run-name: e2e-test / create-check-run
          title: E2E Test (create-check-run)
          summary: |
            This check runs end-to-end tests for the "create-check-run" operation.
            It should create a check run successfully.
          text: |
            {"value": 123}

      - id: e2e-get-check-run
        name: Run int128/checks-action (get-check-run)
        uses: ./
        with:
          operation: get-check-run
          check-run-name: e2e-test / create-check-run
      - run: echo "$CHECK_RUN_TEXT" | jq .
        env:
          CHECK_RUN_TEXT: ${{ steps.e2e-get-check-run.outputs.check-run-text }}

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run check --fix
      - uses: int128/update-generated-files-action@d9aac571db84cee6c16fa20190621e9deb2bc575 # v2.67.0
